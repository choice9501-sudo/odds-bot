name: 24/7 Odds Radar Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 부품 설치
        run: |
          pip install requests beautifulsoup4 cloudscraper deep-translator feedparser schedule

      - name: 오즈 레이더 봇 가동
        run: |
          python odds_radar.py

      - name: 중복 방지 기록 영구 저장 (Cloud History Save)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f sent_history.json ]; then
            git add sent_history.json
            git commit -m "Update sent history [skip ci]" || exit 0
            git push
          fi
