name: Run Odds Radar Bot

on:
  schedule:
    - cron: '*/15 * * * *'  # 15분마다 24시간 자동 실행
  workflow_dispatch:        # 'Run workflow' 수동 즉시 실행 버튼 활성화

permissions:
  contents: write           # sent_history.json 저장을 위한 쓰기 권한 부여

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper feedparser

      - name: Run Odds Radar Bot
        run: |
          python odds_radar.py

      - name: Commit and Push sent_history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull || true
          git add sent_history.json
          git commit -m "Auto: Update sent_history [skip ci]" || echo "No changes to commit"
          git push
